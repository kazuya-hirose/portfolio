<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="440" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, Meiryo, sans-serif">
  <polyline points="55,260 55,20" stroke="#888" stroke-width="1.5" fill="none"/>
  <polyline points="55,260 430,260" stroke="#888" stroke-width="1.5" fill="none"/>
  <text x="435" y="264" font-size="14">σ_p</text>
  <text x="35" y="18" font-size="14">μ_p</text>
  <!-- domestic-only frontier -->
  <path d="M195,188 C258,156 348,136 411,124" stroke="#2980b9" stroke-width="3" fill="none"/>
  <text x="330" y="150" font-size="13" fill="#2980b9">国内資産のみ</text>
  <!-- global frontier -->
  <path d="M132,164 C204,120 312,88 411,68" stroke="#16a085" stroke-width="3.5" fill="none"/>
  <text x="240" y="95" font-size="13" fill="#16a085">国際分散投資</text>
  <!-- improvement arrow -->
  <line x1="300" y1="145" x2="270" y2="105" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
