<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="480" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, Meiryo, sans-serif">
  <!-- コール -->
  <polyline points="40,190 40,20" stroke="#888" stroke-width="1.5" fill="none"/>
  <polyline points="40,190 230,190" stroke="#888" stroke-width="1.5" fill="none"/>
  <polyline points="40,190 130,190 210,40" stroke="#2980b9" stroke-width="3.5" fill="none"/>
  <line x1="130" y1="190" x2="130" y2="196" stroke="#888" stroke-width="1.5"/>
  <text x="130" y="210" text-anchor="middle" font-size="13">K</text>
  <text x="235" y="193" font-size="13">S</text>
  <text x="20" y="20" font-size="13">ペイオフ</text>
  <text x="150" y="70" font-size="13" fill="#2980b9">max(S-K,0)</text>
  <text x="135" y="15" text-anchor="middle" font-size="14" font-weight="bold">(a) コール</text>

  <!-- プット -->
  <polyline points="300,190 300,20" stroke="#888" stroke-width="1.5" fill="none"/>
  <polyline points="300,190 490,190" stroke="#888" stroke-width="1.5" fill="none"/>
  <polyline points="300,40 380,190" stroke="#c0392b" stroke-width="3.5" fill="none"/>
  <line x1="380" y1="190" x2="380" y2="196" stroke="#888" stroke-width="1.5"/>
  <text x="380" y="210" text-anchor="middle" font-size="13">K</text>
  <text x="495" y="193" font-size="13">S</text>
  <text x="280" y="20" font-size="13">ペイオフ</text>
  <text x="395" y="70" font-size="13" fill="#c0392b">max(K-S,0)</text>
  <text x="395" y="15" text-anchor="middle" font-size="14" font-weight="bold">(b) プット</text>
</svg>
